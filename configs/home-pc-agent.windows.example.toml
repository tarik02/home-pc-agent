[agent]
id = "desktop-pc"
name = "Desktop PC"
data_dir = 'C:\ProgramData\home-pc-agent'

[transports.mqtt]
enabled = false
broker = "tcp://homeassistant.local:1883"
client_id = "home-pc-agent-desktop"
topic_prefix = "pc/desktop"
discovery_base = "homeassistant"
connect_timeout = "5s"

[plugins.session_windows]
enabled = true

[plugins.display_windows]
enabled = true

[plugins.powerplan_windows]
enabled = true
timeout = "10s"

[plugins.fancontrol_windows]
enabled = false
timeout = "20s"

