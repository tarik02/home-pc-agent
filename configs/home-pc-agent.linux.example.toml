[agent]
id = "desktop-pc"
name = "Desktop PC"
data_dir = "/var/lib/home-pc-agent"

[transports.mqtt]
enabled = false
broker = "tcp://homeassistant.local:1883"
client_id = "home-pc-agent-desktop"
topic_prefix = "pc/desktop"
discovery_base = "homeassistant"
connect_timeout = "5s"

[plugins.session_loginctl]
enabled = true

[plugins.display_kscreen]
enabled = true

[plugins.powerprofile_powerprofilesctl]
enabled = true
timeout = "10s"

