name: ci

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            example_config: configs/home-pc-agent.linux.example.toml
            binary_ext: ""
          - os: windows-latest
            example_config: configs/home-pc-agent.windows.example.toml
            binary_ext: .exe
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Buf
        if: matrix.os == 'ubuntu-latest'
        uses: bufbuild/buf-setup-action@v1
        with:
          version: 1.57.2

      - name: Check generated protobuf code
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          buf lint
          buf generate
          git diff --exit-code -- internal/plugins/fancontrol/fancontrol.pb.go

      - name: Check formatting
        shell: bash
        run: |
          files="$(gofmt -l $(find . -name '*.go' -not -path './.git/*'))"
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi

      - name: Test
        run: go test ./...

      - name: Validate example config
        run: go run ./cmd/home-pc-agent config validate --config ./${{ matrix.example_config }}

      - name: Build
        shell: bash
        run: go build -o "${{ runner.temp }}/home-pc-agent${{ matrix.binary_ext }}" ./cmd/home-pc-agent

      - name: Check GoReleaser config
        if: matrix.os == 'windows-latest'
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
